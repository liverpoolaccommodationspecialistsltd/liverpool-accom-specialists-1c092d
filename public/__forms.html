<!-- Static skeleton so Netlify detects the enquiry form at build time -->
<html>
  <body>
    <form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="enquiry" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <select name="enquiryType"><option value="">-</option></select>
      <input name="propertyArea" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
